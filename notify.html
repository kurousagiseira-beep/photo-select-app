<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15110b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KISS通知"><link rel="manifest" href="./notify-manifest.webmanifest"><title>CLUB KISS 注文通知</title><style>*{box-sizing:border-box}body{margin:0;background:#0c0b0a;color:#f7e9c8;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{background:#1c170e;border-bottom:1px solid #a7874b;padding:24px 16px;text-align:center}h1{font-size:24px;letter-spacing:2px;color:#ebc773;margin:0}main{max-width:650px;margin:auto;padding:16px}.panel{border:1px solid #7c6335;background:#1d1913;padding:16px;border-radius:16px;margin:12px 0}input,button{font:inherit;padding:14px;border-radius:10px}input{background:#121212;color:#fff;border:1px solid #88734e;width:100%;margin:10px 0}button{background:#d5b367;border:0;color:#1b1305;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.order{border:1px solid #876c3d;border-radius:14px;padding:14px;margin:12px 0;background:#3b2c18}.order.ack{background:#232323}.muted{color:#c0ac82;font-size:14px}.status{padding:10px;border-radius:8px;background:#2c2418}a{color:#ebc773}#alertOverlay{position:fixed;inset:0;background:#9b1717f5;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}#alertOverlay[hidden]{display:none}#alertOverlay .alertBox{max-width:480px;width:100%;background:#230808;border:3px solid #fff;border-radius:22px;padding:28px 16px;box-shadow:0 0 55px #f00}#alertOverlay h2{font-size:34px;color:white}#alertOverlay button{margin:6px}.order button{margin:4px}.copyButton{background:#f4dca3}.lineShare{background:#06c755;color:white;font-weight:800;padding:15px 18px;width:100%;margin:8px 0}</style></head><body><header><h1>🔔 CLUB KISS</h1><div>注文通知アプリ</div></header><div id="alertOverlay" hidden><div class="alertBox"><h2>🚨 新しい注文！</h2><p id="alertText" style="font-size:23px"></p><button onclick="closeAlert()">注文を確認する</button></div></div><main><div class="panel" id="login"><h2>スタッフ認証</h2><p class="muted">スタッフPINで注文を受信します。LINEは使用しません。</p><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4桁のスタッフPIN"><button onclick="connect()">通知を受信する</button></div><section id="inbox" hidden><div class="panel"><h2>📲 iPhoneの自動通知</h2><p id="pushStatus" class="muted">通知設定を確認中…</p><button id="pushEnable" onclick="enablePush()">このiPhoneで通知を受け取る</button><p class="muted">Safariの共有ボタンから「ホーム画面に追加」して、ホーム画面のKISS通知アプリから開いてね。通知を許可すると、アプリを閉じていても注文を知らせます。</p></div><div class="panel"><h2>📨 受信した注文</h2><p class="muted">5秒ごとに自動更新。画面を開いている間に新着を確認できます。</p><p id="status" class="status">接続中…</p><button onclick="load()">今すぐ更新</button> <button onclick="disconnect()">ログアウト</button><p class="muted">※閉じている間のプッシュ通知には対応していません。</p></div><div id="orders"></div></section><p class="muted"><a href="./staff.html">スタッフ管理画面へ</a></p></main><script>const API='https://clubkiss-line-notify.kurousagiseira.workers.dev';let pin='',last=0,initialized=false,busy=false,latestItems=[],alertId='',audioContext=null;function orderText(x){return ['🔔 CLUB KISS '+x.type,'【卓番号】'+x.table+'卓','【指名キャスト】'+(x.castName||'未設定'),...(x.partySize?['【人数】'+x.partySize+'名']:[]),...(x.plan?['【プラン】'+x.plan,'【サービス】'+x.can+' × '+(x.quantity||1)+'本']:[]),...(x.schedule?.length?['【タイムテーブル】',...x.schedule.map(r=>(r.start||'')+'〜'+(r.end||'')+' '+(r.name||''))]:[]),'【受付日時】'+new Date(x.time).toLocaleString('ja-JP')].join('\n')}async function copyOrder(id){const x=latestItems.find(v=>v.id===id);if(!x)return;const t=orderText(x);try{await navigator.clipboard.writeText(t);alert('注文内容をコピーしました。LINEに貼り付けて送れます。')}catch(e){prompt('長押ししてコピーしてください',t)}}function shareLine(id){const x=latestItems.find(v=>v.id===id);if(!x)return;const url='https://line.me/R/share?text='+encodeURIComponent(orderText(x));location.href=url}function soundAlert(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioContext=audioContext||new C();audioContext.resume();[0,.25,.5].forEach(t=>{const o=audioContext.createOscillator(),g=audioContext.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(audioContext.destination);o.start(audioContext.currentTime+t);o.stop(audioContext.currentTime+t+.16)})}catch(e){}}function showAlert(x){alertId=x.id;document.getElementById('alertText').textContent=x.table+'卓｜'+x.type+'｜'+x.castName;document.getElementById('alertOverlay').hidden=false;soundAlert();if(navigator.vibrate)navigator.vibrate([300,150,300])}function closeAlert(){document.getElementById('alertOverlay').hidden=true;document.getElementById('orders').scrollIntoView({behavior:'smooth'});}async function pushState(){const status=document.getElementById('pushStatus'),button=document.getElementById('pushEnable');if(!('serviceWorker'in navigator)||!('PushManager'in window)){status.textContent='この環境ではプッシュ通知を利用できません';button.disabled=true;return}if(!window.matchMedia('(display-mode: standalone)').matches&&!navigator.standalone){status.textContent='最初にSafariからホーム画面へ追加し、追加したアプリから開いてください';return}try{const reg=await navigator.serviceWorker.register('./notify-sw.js',{scope:'./'});const sub=await reg.pushManager.getSubscription();if(sub){status.textContent='✓ このiPhoneでプッシュ通知を登録済み';button.textContent='通知登録を更新する'}else status.textContent='未登録：下のボタンから通知を許可してください'}catch(e){status.textContent='通知設定エラー：'+e.message}}
function keyBytes(b64){const bin=atob(b64.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-b64.length%4)%4));return Uint8Array.from(bin,c=>c.charCodeAt(0))}
async function enablePush(){if(!pin)return alert('先にスタッフPINでログインしてください');const status=document.getElementById('pushStatus');try{if(!window.matchMedia('(display-mode: standalone)').matches&&!navigator.standalone)throw Error('Safariからホーム画面に追加し、追加したアプリで開いてください');const r=await fetch(API+'/photo/push-key');const info=await r.json();if(!info.configured)throw Error('サーバー側の通知キーが未設定です。Cloudflareの設定が必要です');const permission=await Notification.requestPermission();if(permission!=='granted')throw Error('iPhoneの通知を許可してください');const reg=await navigator.serviceWorker.register('./notify-sw.js',{scope:'./'});const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:keyBytes(info.publicKey)});const d=await call({action:'noop'});const response=await fetch(API+'/photo/push-subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,subscription:sub.toJSON()})});const result=await response.json();if(!response.ok)throw Error(result.error||'通知登録に失敗しました');status.textContent='✓ このiPhoneでプッシュ通知を受け取れます';document.getElementById('pushEnable').textContent='通知登録を更新する'}catch(e){status.textContent='通知設定エラー：'+e.message}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function call(body){const r=await fetch(API+'/photo/notifications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,...body})});const d=await r.json();if(!r.ok)throw Error(d.error||'通信エラー');return d}async function connect(){const v=document.getElementById('pin').value.trim();if(!/^\d{4}$/.test(v))return alert('4桁のPINを入力してください');pin=v;try{await load();document.getElementById('login').hidden=true;document.getElementById('inbox').hidden=false;pushState()}catch(e){pin='';alert('認証に失敗しました：'+e.message)}}function disconnect(){pin='';initialized=false;last=0;document.getElementById('inbox').hidden=true;document.getElementById('login').hidden=false}async function load(){if(!pin||busy)return;busy=true;try{const d=await call({}),items=d.notifications||[],newest=Math.max(0,...items.map(x=>x.time||0));const fresh=items.filter(x=>x.time>last&&!x.ackAt);if(initialized&&fresh.length){showAlert(fresh[0]);document.getElementById('status').textContent='🔔 新しい注文が届きました！';if(navigator.vibrate)navigator.vibrate([200,100,200])}else document.getElementById('status').textContent='✓ 受信中｜'+new Date().toLocaleTimeString('ja-JP');initialized=true;last=Math.max(last,newest);latestItems=items;document.getElementById('orders').innerHTML=items.length?items.map(x=>'<div class="order'+(x.ackAt?' ack':'')+'"><h3>'+(x.ackAt?'✓ 確認済み':'🔴 未確認')+'｜'+esc(x.type)+'｜'+esc(x.table)+'卓</h3><p>指名キャスト：'+esc(x.castName)+'</p>'+(x.plan?'<p>'+esc(x.plan)+'／'+esc(x.can)+' × '+Number(x.quantity||1)+'本</p>':'')+(x.partySize?'<p>人数：'+Number(x.partySize)+'名</p>':'')+'<p class="muted">'+new Date(x.time).toLocaleString('ja-JP')+'</p>'+'<p><button class="copyButton" data-id="'+esc(x.id)+'" onclick="copyOrder(this.dataset.id)">📋 内容をコピー</button> <button class="lineShare" data-id="'+esc(x.id)+'" onclick="shareLine(this.dataset.id)">🟢 LINEグループに共有</button></p>'+(x.ackAt?'':'<button data-id="'+esc(x.id)+'" onclick="ack(this.dataset.id)">確認済みにする</button>')+'</div>').join(''):'<p>まだ注文はありません</p>'}catch(e){document.getElementById('status').textContent='受信エラー：'+e.message;throw e}finally{busy=false}}async function ack(id){try{await call({action:'ack',id});await load()}catch(e){alert(e.message)}}setInterval(()=>{if(pin&&!document.hidden)load().catch(()=>{})},5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pin)load().catch(()=>{})});</script></body></html>
