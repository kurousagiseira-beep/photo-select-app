<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15110b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KISS通知"><link rel="manifest" href="./notify-manifest.webmanifest"><title>CLUB KISS 注文通知</title><style>*{box-sizing:border-box}body{margin:0;background:#0c0b0a;color:#f7e9c8;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{background:#1c170e;border-bottom:1px solid #a7874b;padding:24px 16px;text-align:center}h1{font-size:24px;letter-spacing:2px;color:#ebc773;margin:0}main{max-width:650px;margin:auto;padding:16px}.panel{border:1px solid #7c6335;background:#1d1913;padding:16px;border-radius:16px;margin:12px 0}input,button{font:inherit;padding:14px;border-radius:10px}input{background:#121212;color:#fff;border:1px solid #88734e;width:100%;margin:10px 0}button{background:#d5b367;border:0;color:#1b1305;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.order{border:1px solid #876c3d;border-radius:14px;padding:14px;margin:12px 0;background:#3b2c18}.order.ack{background:#232323}.muted{color:#c0ac82;font-size:14px}.status{padding:10px;border-radius:8px;background:#2c2418}a{color:#ebc773}</style></head><body><header><h1>🔔 CLUB KISS</h1><div>注文通知アプリ</div></header><main><div class="panel" id="login"><h2>スタッフ認証</h2><p class="muted">スタッフPINで注文を受信します。LINEは使用しません。</p><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4桁のスタッフPIN"><button onclick="connect()">通知を受信する</button></div><section id="inbox" hidden><div class="panel"><h2>📨 受信した注文</h2><p class="muted">5秒ごとに自動更新。画面を開いている間に新着を確認できます。</p><p id="status" class="status">接続中…</p><button onclick="load()">今すぐ更新</button> <button onclick="disconnect()">ログアウト</button><p class="muted">※閉じている間のプッシュ通知には対応していません。</p></div><div id="orders"></div></section><p class="muted"><a href="./staff.html">スタッフ管理画面へ</a></p></main><script>const API='https://clubkiss-line-notify.kurousagiseira.workers.dev';let pin='',last=0,initialized=false,busy=false;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function call(body){const r=await fetch(API+'/photo/notifications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,...body})});const d=await r.json();if(!r.ok)throw Error(d.error||'通信エラー');return d}async function connect(){const v=document.getElementById('pin').value.trim();if(!/^\d{4}$/.test(v))return alert('4桁のPINを入力してください');pin=v;try{await load();document.getElementById('login').hidden=true;document.getElementById('inbox').hidden=false}catch(e){pin='';alert('認証に失敗しました：'+e.message)}}function disconnect(){pin='';initialized=false;last=0;document.getElementById('inbox').hidden=true;document.getElementById('login').hidden=false}async function load(){if(!pin||busy)return;busy=true;try{const d=await call({}),items=d.notifications||[],newest=Math.max(0,...items.map(x=>x.time||0));if(initialized&&items.some(x=>x.time>last&&!x.ackAt)){document.getElementById('status').textContent='🔔 新しい注文が届きました！';if(navigator.vibrate)navigator.vibrate([200,100,200])}else document.getElementById('status').textContent='✓ 受信中｜'+new Date().toLocaleTimeString('ja-JP');initialized=true;last=Math.max(last,newest);document.getElementById('orders').innerHTML=items.length?items.map(x=>'<div class="order'+(x.ackAt?' ack':'')+'"><h3>'+(x.ackAt?'✓ 確認済み':'🔴 未確認')+'｜'+esc(x.type)+'｜'+esc(x.table)+'卓</h3><p>指名キャスト：'+esc(x.castName)+'</p>'+(x.plan?'<p>'+esc(x.plan)+'／'+esc(x.can)+' × '+Number(x.quantity||1)+'本</p>':'')+(x.partySize?'<p>人数：'+Number(x.partySize)+'名</p>':'')+'<p class="muted">'+new Date(x.time).toLocaleString('ja-JP')+'</p>'+(x.ackAt?'':'<button data-id="'+esc(x.id)+'" onclick="ack(this.dataset.id)">確認済みにする</button>')+'</div>').join(''):'<p>まだ注文はありません</p>'}catch(e){document.getElementById('status').textContent='受信エラー：'+e.message;throw e}finally{busy=false}}async function ack(id){try{await call({action:'ack',id});await load()}catch(e){alert(e.message)}}setInterval(()=>{if(pin&&!document.hidden)load().catch(()=>{})},5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pin)load().catch(()=>{})});</script></body></html>
