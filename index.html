<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHOTO SELECT</title><style>:root{font-family:system-ui;background:#090909;color:#f5e8c9}*{box-sizing:border-box}body{margin:0}header{padding:25px 16px;text-align:center;border-bottom:1px solid #6f5525;background:#14110b}h1{letter-spacing:4px;color:#e6c16b;margin:0}small{color:#b89b62}nav{display:flex;position:sticky;top:0;background:#111;z-index:2}nav button{flex:1;border-radius:0}button{background:#b99545;color:#120e05;border:0;border-radius:10px;padding:12px;font-weight:700;cursor:pointer}nav button{background:#171717;color:#e4c67e;border-bottom:2px solid #333}nav button.active{border-color:#e7bc60}main{padding:16px;max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}.card{background:#191919;border:1px solid #57441e;border-radius:14px;overflow:hidden}.photo{width:100%;aspect-ratio:3/4;object-fit:cover;background:#292929;display:grid;place-items:center;font-size:55px}.info{padding:12px}.info p{color:#bbb;font-size:13px}.selected{outline:3px solid #e4bd63}input,textarea{background:#222;color:white;border:1px solid #705c32;border-radius:8px;padding:12px;width:100%;margin:6px 0 12px}section{margin-bottom:25px}.panel{padding:16px;background:#171717;border:1px solid #53401d;border-radius:12px;margin:12px 0}.muted{color:#aaa;font-size:13px}.danger{background:#69312b;color:white}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hide{display:none}hr{border:0;border-top:1px solid #55421f;margin:20px 0}</style><header><small>HOST CLUB</small><h1>PHOTO SELECT</h1><small>写真指名システム</small></header><nav><button id="tab-customer" onclick="show('customer')">お客様</button><button id="tab-staff" onclick="show('staff')">スタッフ</button><button id="tab-admin" onclick="show('admin')">管理者</button></nav><main><div id="customer"><h2>気になるキャストを選択</h2><p class="muted">複数選択できます。選び終わったら「指名を送信」を押してください。</p><div id="cards" class="grid"></div><div class="panel"><div id="selection"></div><button onclick="submitNomination()">指名を送信</button><p id="sent" class="muted"></p></div></div><div id="staff" class="hide"><h2>指名受付</h2><div id="requests"></div><button onclick="show('customer')">お客様画面に戻る</button></div><div id="admin" class="hide"><h2>管理者</h2><div id="adminLogin"><p>管理者用の暗証番号を入力</p><input type="password" id="pin" placeholder="暗証番号"><button onclick="login()">ログイン</button><p class="muted">初回の暗証番号は 5678。これは端末内だけの簡易ロックです。</p></div><div id="adminContent" class="hide"><h3>キャスト登録</h3><input id="name" placeholder="キャスト名"><textarea id="bio" placeholder="自己紹介"></textarea><label>写真を選択<input id="photoInput" type="file" accept="image/*"></label><button onclick="addCast()">登録</button><h3>登録済みキャスト</h3><div id="castAdmin"></div><h3>確定指名ランキング</h3><div id="ranking"></div><button onclick="logout()">管理画面を閉じる</button></div></div></main><script>
const KEY='photo_select_demo_v1';let db=JSON.parse(localStorage.getItem(KEY)||'{"casts":[],"requests":[]}');let selected=[];let unlocked=false;function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(p){['customer','staff','admin'].forEach(x=>{document.getElementById(x).classList.toggle('hide',x!==p);document.getElementById('tab-'+x).classList.toggle('active',x===p)});render()}function render(){document.getElementById('cards').innerHTML=db.casts.filter(c=>c.active).map(c=>'<div class="card '+(selected.includes(c.id)?'selected':'')+'"><div class="photo">'+(c.photo?'<img class="photo" src="'+c.photo+'">':'👤')+'</div><div class="info"><b>'+esc(c.name)+'</b><p>'+esc(c.bio)+'</p><button onclick="toggle('+c.id+')">'+(selected.includes(c.id)?'✓ 選択中':'この人を選ぶ')+'</button></div></div>').join('')||'<p>キャストがまだ登録されていません。管理者画面から登録してください。</p>';document.getElementById('selection').textContent='選択中：'+selected.length+'名';document.getElementById('requests').innerHTML=db.requests.slice().reverse().map(r=>'<div class="panel"><b>'+new Date(r.time).toLocaleString('ja-JP')+'</b><p>'+r.ids.map(id=>esc(db.casts.find(c=>c.id===id)?.name||'削除済み')).join('・')+'</p><p>状態：'+(r.status==='pending'?'確認待ち':r.status==='done'?'確定':'取消')+'</p>'+(r.status==='pending'?'<button onclick="changeStatus('+r.id+',\'done\')">確定</button> <button class="danger" onclick="changeStatus('+r.id+',\'cancel\')">取消</button>':'')+'</div>').join('')||'<p>受付はまだありません。</p>';if(unlocked){document.getElementById('castAdmin').innerHTML=db.casts.map(c=>'<div class="panel"><b>'+esc(c.name)+'</b> <button onclick="toggleActive('+c.id+')">'+(c.active?'非表示にする':'表示する')+'</button> <button class="danger" onclick="deleteCast('+c.id+')">削除</button></div>').join('');let scores=db.casts.map(c=>({name:c.name,n:db.requests.filter(r=>r.status==='done'&&r.ids.includes(c.id)).length})).sort((a,b)=>b.n-a.n);document.getElementById('ranking').innerHTML=scores.map((s,i)=>'<p>'+(i+1)+'位 '+esc(s.name)+'：'+s.n+'件</p>').join('')||'<p>データなし</p>'}}function toggle(id){selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];render()}function submitNomination(){if(!selected.length)return alert('キャストを選んでください');db.requests.push({id:Date.now(),ids:[...selected],status:'pending',time:Date.now()});save();selected=[];render();document.getElementById('sent').textContent='指名を受け付けました。スタッフにお声がけください。'}function changeStatus(id,status){let r=db.requests.find(r=>r.id===id);if(r){r.status=status;save();render()}}function login(){if(document.getElementById('pin').value!=='5678')return alert('暗証番号が違います');unlocked=true;document.getElementById('adminLogin').classList.add('hide');document.getElementById('adminContent').classList.remove('hide');render()}function logout(){unlocked=false;document.getElementById('adminLogin').classList.remove('hide');document.getElementById('adminContent').classList.add('hide');document.getElementById('pin').value=''}function addCast(){let name=document.getElementById('name').value.trim();if(!name)return alert('名前を入力してください');let f=document.getElementById('photoInput').files[0];if(f&&f.size>2*1024*1024)return alert('写真は2MB以下にしてください');let finish=photo=>{db.casts.push({id:Date.now(),name,bio:document.getElementById('bio').value,photo,active:true});try{save()}catch(e){db.casts.pop();return alert('保存容量を超えました。写真を小さくしてください')}document.getElementById('name').value='';document.getElementById('bio').value='';document.getElementById('photoInput').value='';render()};if(f){let rd=new FileReader();rd.onload=()=>finish(rd.result);rd.readAsDataURL(f)}else finish('')}function toggleActive(id){let c=db.casts.find(c=>c.id===id);c.active=!c.active;save();render()}function deleteCast(id){if(!confirm('削除しますか？'))return;db.casts=db.casts.filter(c=>c.id!==id);save();render()}show('customer');
</script></html>
