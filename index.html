<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHOTO SELECT</title><style>:root{font-family:system-ui;background:#090909;color:#f5e8c9}*{box-sizing:border-box}body{margin:0}header{padding:25px 16px;text-align:center;border-bottom:1px solid #6f5525;background:#14110b}h1{letter-spacing:4px;color:#e6c16b;margin:0}small{color:#b89b62}nav{display:flex;position:sticky;top:0;background:#111;z-index:2}nav button{flex:1;border-radius:0}button{background:#b99545;color:#120e05;border:0;border-radius:10px;padding:12px;font-weight:700;cursor:pointer}nav button{background:#171717;color:#e4c67e;border-bottom:2px solid #333}nav button.active{border-color:#e7bc60}main{padding:16px;max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}.card{background:#191919;border:1px solid #57441e;border-radius:14px;overflow:hidden}.photo{width:100%;aspect-ratio:3/4;object-fit:cover;background:#292929;display:grid;place-items:center;font-size:55px}.info{padding:12px}.info p{color:#bbb;font-size:13px}.photo-strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.photo-strip img{flex:0 0 100%;width:100%;aspect-ratio:3/4;object-fit:cover;scroll-snap-align:start}.photo-count{font-size:12px;color:#e6c16b;padding:5px 10px}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.thumbs img{width:65px;height:85px;object-fit:cover;border-radius:6px}.selected{outline:3px solid #e4bd63}input,textarea{background:#222;color:white;border:1px solid #705c32;border-radius:8px;padding:12px;width:100%;margin:6px 0 12px}section{margin-bottom:25px}.panel{padding:16px;background:#171717;border:1px solid #53401d;border-radius:12px;margin:12px 0}.muted{color:#aaa;font-size:13px}.danger{background:#69312b;color:white}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hide{display:none}hr{border:0;border-top:1px solid #55421f;margin:20px 0}</style><header><small>HOST CLUB</small><h1>PHOTO SELECT</h1><small>写真指名システム</small></header><nav><button id="tab-customer" onclick="show('customer')">お客様</button><button id="tab-staff" onclick="show('staff')">スタッフ</button><button id="tab-admin" onclick="show('admin')">管理者</button></nav><main><div id="customer"><h2>気になるキャストを選択</h2><p class="muted">複数選択できます。選び終わったら「指名を送信」を押してください。</p><div id="cards" class="grid"></div><div class="panel"><div id="selection"></div><button onclick="submitNomination()">指名を送信</button><p id="sent" class="muted"></p></div></div><div id="staff" class="hide"><h2>指名受付</h2><p class="muted">指名確定時にスタッフLINEグループへ通知します。</p><label>通知用スタッフPIN<input id="staffNotifyPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4桁のスタッフPIN"></label><p id="notifyResult" class="muted"></p><div id="requests"></div><button onclick="show('customer')">お客様画面に戻る</button></div><div id="admin" class="hide"><h2>管理者</h2><div id="adminLogin"><p>管理者用の暗証番号を入力</p><input type="password" id="pin" placeholder="暗証番号"><button onclick="login()">ログイン</button><p class="muted">初回の暗証番号は 5678。これは端末内だけの簡易ロックです。</p></div><div id="adminContent" class="hide"><h3>キャスト登録</h3><input id="name" placeholder="キャスト名"><textarea id="bio" placeholder="自己紹介"></textarea><label>写真を選択（複数可）<input id="photoInput" type="file" accept="image/*" multiple><small>1人につき最大10枚。自動で写真を軽量化します。</small></label><button onclick="addCast()">登録</button><h3>登録済みキャスト</h3><div id="castAdmin"></div><h3>確定指名ランキング</h3><div id="ranking"></div><button onclick="logout()">管理画面を閉じる</button></div></div></main><script>
const KEY='photo_select_demo_v1';let db=JSON.parse(localStorage.getItem(KEY)||'{"casts":[],"requests":[]}');let selected=[];let unlocked=false;function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(p){['customer','staff','admin'].forEach(x=>{document.getElementById(x).classList.toggle('hide',x!==p);document.getElementById('tab-'+x).classList.toggle('active',x===p)});render()}function render(){document.getElementById('cards').innerHTML=db.casts.filter(c=>c.active).map(c=>'<div class="card '+(selected.includes(c.id)?'selected':'')+'"><div class="photo-strip">'+((c.photos?.length?c.photos:(c.photo?[c.photo]:[])).map(p=>'<img src="'+p+'" loading="lazy">').join('')||'<div class="photo">👤</div>')+'</div><div class="photo-count">'+((c.photos?.length||(c.photo?1:0))?'写真 '+(c.photos?.length||1)+'枚 ・ 左右にスワイプ':'写真未登録')+'</div><div class="info"><b>'+esc(c.name)+'</b><p>'+esc(c.bio)+'</p><button onclick="toggle('+c.id+')">'+(selected.includes(c.id)?'✓ 選択中':'この人を選ぶ')+'</button></div></div>').join('')||'<p>キャストがまだ登録されていません。管理者画面から登録してください。</p>';document.getElementById('selection').textContent='選択中：'+selected.length+'名';document.getElementById('requests').innerHTML=db.requests.slice().reverse().map(r=>'<div class="panel"><b>'+new Date(r.time).toLocaleString('ja-JP')+'</b><p>'+r.ids.map(id=>esc(db.casts.find(c=>c.id===id)?.name||'削除済み')).join('・')+'</p><p>状態：'+(r.status==='pending'?'確認待ち':r.status==='done'?'確定':'取消')+'</p>'+(r.status==='pending'?'<button onclick="changeStatus('+r.id+',\'done\')">確定</button> <button class="danger" onclick="changeStatus('+r.id+',\'cancel\')">取消</button>':'')+'</div>').join('')||'<p>受付はまだありません。</p>';if(unlocked){document.getElementById('castAdmin').innerHTML=db.casts.map(c=>'<div class="panel"><b>'+esc(c.name)+'</b><div class="thumbs">'+(c.photos?.length?c.photos:(c.photo?[c.photo]:[])).map((p,i)=>'<div><img src="'+p+'"><button class="danger" onclick="removePhoto('+c.id+','+i+')">削除</button></div>').join('')+'</div><label>写真を追加<input type="file" accept="image/*" multiple onchange="addPhotos('+c.id+',this)"></label> <button onclick="toggleActive('+c.id+')">'+(c.active?'非表示にする':'表示する')+'</button> <button class="danger" onclick="deleteCast('+c.id+')">削除</button></div>').join('');let scores=db.casts.map(c=>({name:c.name,n:db.requests.filter(r=>r.status==='done'&&r.ids.includes(c.id)).length})).sort((a,b)=>b.n-a.n);document.getElementById('ranking').innerHTML=scores.map((s,i)=>'<p>'+(i+1)+'位 '+esc(s.name)+'：'+s.n+'件</p>').join('')||'<p>データなし</p>'}}function toggle(id){selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];render()}function submitNomination(){if(!selected.length)return alert('キャストを選んでください');db.requests.push({id:Date.now(),ids:[...selected],status:'pending',time:Date.now()});save();selected=[];render();document.getElementById('sent').textContent='指名を受け付けました。スタッフにお声がけください。'}let confirming=false;async function changeStatus(id,status){let r=db.requests.find(r=>r.id===id);if(!r||r.status!=='pending'||confirming)return;if(status==='done'){const pin=document.getElementById('staffNotifyPin').value.trim();if(!/^\d{4}$/.test(pin))return alert('スタッフPINを入力してください');const names=r.ids.map(id=>db.casts.find(c=>c.id===id)?.name).filter(Boolean);if(!names.length)return alert('キャスト名が見つかりません');if(!confirm(names.join('・')+' の写真指名を確定し、LINEへ通知しますか？'))return;confirming=true;const msg=document.getElementById('notifyResult');msg.textContent='LINEに通知しています…';try{const res=await fetch('https://clubkiss-line-notify.kurousagiseira.workers.dev/photo-confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,names})});const data=await res.json();if(!res.ok)throw Error(data.error||'送信できませんでした');r.status='done';save();msg.textContent='LINEに通知して指名を確定しました';document.getElementById('staffNotifyPin').value='';render()}catch(e){msg.textContent='未確定：'+e.message;alert('LINE通知に失敗したため、指名は未確定です。\n'+e.message)}finally{confirming=false}}else{r.status=status;save();render()}}function login(){if(document.getElementById('pin').value!=='5678')return alert('暗証番号が違います');unlocked=true;document.getElementById('adminLogin').classList.add('hide');document.getElementById('adminContent').classList.remove('hide');render()}function logout(){unlocked=false;document.getElementById('adminLogin').classList.remove('hide');document.getElementById('adminContent').classList.add('hide');document.getElementById('pin').value=''}async function compressPhoto(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(Error('画像ファイルを選んでください'));const reader=new FileReader();reader.onerror=()=>reject(Error('読み込みに失敗'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('画像を開けません'));img.onload=()=>{const scale=Math.min(1,900/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.68))};img.src=reader.result};reader.readAsDataURL(file)})}
async function readPhotos(files){const list=[...files];if(list.length>10)throw Error('一度に選べるのは10枚までです');return Promise.all(list.map(compressPhoto))}
async function addCast(){const name=document.getElementById('name').value.trim();if(!name)return alert('名前を入力してください');try{const photos=await readPhotos(document.getElementById('photoInput').files);const c={id:Date.now(),name,bio:document.getElementById('bio').value,photos,active:true};db.casts.push(c);try{save()}catch(e){db.casts.pop();throw Error('保存容量が足りません。写真を減らしてください')}document.getElementById('name').value='';document.getElementById('bio').value='';document.getElementById('photoInput').value='';render()}catch(e){alert(e.message)}}
async function addPhotos(id,input){const c=db.casts.find(c=>c.id===id);if(!c)return;const old=c.photos?.length?c.photos:(c.photo?[c.photo]:[]);try{if(old.length+input.files.length>10)throw Error('1人につき最大10枚です');const photos=await readPhotos(input.files);c.photos=[...old,...photos];const previous=c.photo;delete c.photo;try{save()}catch(e){c.photos=old;c.photo=previous;throw Error('保存容量が足りません。写真を減らしてください')}render()}catch(e){alert(e.message)}}
function removePhoto(id,index){if(!confirm('この写真を削除しますか？'))return;const c=db.casts.find(c=>c.id===id);if(!c)return;const photos=c.photos?.length?c.photos:(c.photo?[c.photo]:[]);photos.splice(index,1);c.photos=photos;delete c.photo;save();render()}
function toggleActive(id){let c=db.casts.find(c=>c.id===id);c.active=!c.active;save();render()}function deleteCast(id){if(!confirm('削除しますか？'))return;db.casts=db.casts.filter(c=>c.id!==id);save();render()}show('customer');
</script></html>
